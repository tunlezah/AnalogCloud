[package]
name = "analog-cloud-media-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["mock"]
# Compile against real system libraries. Requires PipeWire + GStreamer
# development headers on the build host.
real = []
# Mock implementations for unit testing and dev hosts without a Linux
# audio stack (CI, macOS, etc.).
mock = []

[dependencies]
analog-cloud-shared = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
